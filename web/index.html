<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Flagship Neobrutalist Resume & Portfolio built in Flutter Web by Jayeshgiri R. Bavaji.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ECE8DF">

  <!-- Open Graph -->
  <meta property="og:title" content="Jayeshgiri R. Bavaji - Neobrutalist Resume">
  <meta property="og:description" content="Engineering Manager & Technical Architect Portfolio.">
  <meta property="og:type" content="website">

  <title>Jayeshgiri R. Bavaji - Neobrutalist Resume</title>

  <!-- Preconnect Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #ECE8DF;
      margin: 0;
      padding: 0;
      font-family: 'Space Mono', monospace;
      -webkit-font-smoothing: antialiased;
    }

    @media print {
      body {
        background-color: #FFFFFF !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>

  <!-- Flutter Web Bootstrapper -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: {{flutter_service_worker_version}},
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
