<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Flagship Neobrutalist Resume & Portfolio built in Flutter Web by Jayeshgiri R. Bavaji.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ECE8DF">

  <!-- Open Graph -->
  <meta property="og:title" content="Jayeshgiri R. Bavaji - Neobrutalist Resume">
  <meta property="og:description" content="Engineering Manager & Technical Architect Portfolio.">
  <meta property="og:type" content="website">

  <title>Jayeshgiri R. Bavaji - Neobrutalist Resume</title>

  <!-- Preconnect Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #ECE8DF;
      margin: 0;
      padding: 0;
      font-family: 'Space Mono', monospace;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Pre-Flutter Instant Neobrutalist Splash Screen */
    #neobrutalist-loader {
      position: fixed;
      inset: 0;
      background-color: #ECE8DF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.3s ease-out;
      padding: 20px;
      box-sizing: border-box;
    }

    .loader-card {
      background: #DBD7CE;
      border: 2.2px solid #111111;
      box-shadow: 4px 4px 0px #111111;
      border-radius: 16px;
      padding: 32px 28px;
      width: 100%;
      max-width: 380px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .loader-badge {
      background: #ECE8DF;
      border: 2px solid #111111;
      box-shadow: -1px 2px 0px rgba(0, 0, 0, 0.12);
      padding: 6px 16px;
      transform: rotate(-3deg);
      display: inline-block;
      margin-bottom: 18px;
    }

    .loader-badge span {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1.2px;
      color: #111111;
      text-transform: uppercase;
    }

    .loader-title {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #111111;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    /* Brutalist Progress Bar */
    .loader-progress-track {
      width: 100%;
      height: 14px;
      background: #FFFFFF;
      border: 2px solid #111111;
      box-shadow: 2px 2px 0px #111111;
      position: relative;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .loader-progress-bar {
      height: 100%;
      width: 45%;
      background: #3B82F6;
      border-right: 2px solid #111111;
      animation: brutalist-slide 1.4s infinite ease-in-out;
    }

    @keyframes brutalist-slide {
      0% {
        transform: translateX(-100%);
      }
      50% {
        width: 65%;
      }
      100% {
        transform: translateX(250%);
      }
    }

    .loader-subtitle {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      color: #555555;
      letter-spacing: 1px;
    }

    @media print {
      body {
        background-color: #FFFFFF !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      #neobrutalist-loader {
        display: none !important;
      }
    }
  </style>

  <!-- Flutter Web Bootstrapper -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <!-- Instant Neobrutalist Splash Screen (eliminates initial blank screen) -->
  <div id="neobrutalist-loader">
    <div class="loader-card">
      <div class="loader-badge">
        <span>⚡ JAYESHGIRII BAVAJI</span>
      </div>
      <div class="loader-title">NEOBRUTALIST RESUME</div>
      <div class="loader-progress-track">
        <div class="loader-progress-bar"></div>
      </div>
      <div class="loader-subtitle">INITIALIZING FLUTTER ENGINE...</div>
    </div>
  </div>

  <script>
    function dismissLoader() {
      const loader = document.getElementById('neobrutalist-loader');
      if (loader && loader.style.opacity !== '0') {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 300);
      }
    }

    // Safety MutationObserver: dismiss loader immediately when Flutter view is mounted
    const observer = new MutationObserver(function(mutations, obs) {
      if (document.querySelector('flutter-view, flt-glass-pane, flt-scene-host')) {
        dismissLoader();
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Hard fallback timeout (10s)
    setTimeout(dismissLoader, 10000);

    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: {{flutter_service_worker_version}},
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            dismissLoader();
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
