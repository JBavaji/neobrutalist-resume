name: neobrutalist_resume
description: "A flagship, open-source Neobrutalist Resume template built with Flutter Web and Dart."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  printing: ^5.13.2
  pdf: ^3.11.1
  shared_preferences: ^2.2.2

dependency_overrides:
  image: <4.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/resume_data.json
    - assets/data/template_resume_data.json
